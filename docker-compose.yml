version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tap-and-pass-db
    environment:
      POSTGRES_USER: tap
      POSTGRES_PASSWORD: tap_password
      POSTGRES_DB: tapandpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tap"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: tap-and-pass-backend
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://tap:tap_password@postgres:5432/tapandpass
      - JWT_SECRET=${JWT_SECRET:-tap-and-pass-production-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    build: .
    container_name: tap-and-pass-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
