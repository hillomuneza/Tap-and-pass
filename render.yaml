services:
  - type: web
    name: tap-and-pass-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DIST_BUILD
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
